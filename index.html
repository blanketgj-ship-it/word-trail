<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Word Trail</title><link rel="stylesheet" href="style.css?v=3"></head><body>
<div class="app"><header class="toolbar"><button id="topics-back" class="square" aria-label="Topics">←</button><a class="brand" href="./" aria-label="Word Trail"><span class="logo" aria-hidden="true">W</span><span>word<br>trail</span></a><nav><button id="language" class="language" aria-label="Switch to Chinese">中文</button><button id="help" class="square" aria-label="How to play">?</button><button id="menu" class="square" aria-label="Menu">☰</button></nav></header>
<main><section class="puzzle-heading"><h1 id="category">Seasonings, Herbs & Spices</h1><div class="puzzle-actions"><p id="attempt-count">Guesses: 0</p><button id="give-up" class="give-up" type="button">Give up</button></div></section><section class="board" aria-label="Guesses"><div class="table-heading"><h2 id="history-label">Guesses <span>(A–Z)</span></h2><span id="distance-label">Distance</span></div><div id="history" aria-live="polite"></div><div class="guess-row blank" aria-hidden="true"><span></span><span class="distance">?</span></div></section></main>
<section class="dock"><form id="guess-form"><label for="guess" id="input-label">Guesses are arranged alphabetically</label><div class="input-row"><input id="guess" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-describedby="feedback" maxlength="100"><button id="submit" class="yellow" type="submit">Submit</button></div><div id="feedback" role="status" aria-live="polite"></div><div id="suggestions" class="suggestions"></div></form><div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div><div class="bottom-actions"><button id="reveal" class="raised">▣ <span>Reveal Letter</span></button><button id="space" class="raised secondary">Space</button></div></section></div>
<dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" class="square" aria-label="Close">×</button></div><div id="dialog-content"></div></dialog>
<script src="vocabulary.js?v=3"></script><script src="core.js?v=3"></script><script src="app.js?v=3"></script></body></html>
